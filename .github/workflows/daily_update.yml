name: Daily Finance Update

on:
  schedule:
    # 台北時間 05:09 (UTC 21:09) 每日一報
    # 涵蓋了平日的晨報與週末的特刊
    - cron: '9 21 * * *'
  workflow_dispatch:
    inputs:
      task_type:
        description: '任務類型'
        default: 'full_report'
        type: choice
        options: [full_report, news_only]

permissions:
  contents: write

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install dependencies
        run: |
          pip install pandas requests lxml yfinance curl-cffi feedparser google-generativeai

      - name: Run agent
        env:
          # 優先讀取手動觸發選項，定時排程則預設為 full_report
          TASK_TYPE: ${{ inputs.task_type || 'full_report' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python finance_news_agent.py

      - name: Commit & push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Daily finance update"
