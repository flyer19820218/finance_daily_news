name: Daily Finance Update (05:15 & 13:20 Taipei)

on:
  schedule:
    # ☀️ 盤前快報：Taipei 05:15 = UTC 21:15 (前一天)
    - cron: "15 21 * * *"
    # 🌙 盤後分析：Taipei 13:20 = UTC 05:20 (當天下午)
    - cron: "20 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-finance-update
  cancel-in-progress: true

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run agent (generate report)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
        # 🤖 這裡就是您的 AI 爬蟲大腦！
        run: python finance_news_agent.py

      # 用官方套件無痛存檔，徹底解決紅燈衝突
      - name: Commit & push updated data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto update daily data (Morning/Afternoon)"

      - name: Ping Streamlit to keep awake
        run: |
          curl -s https://financedailynews-mobile.streamlit.app/ > /dev/null
          curl -s https://financedailynews-web.streamlit.app/ > /dev/null
