name: Hourly & Daily Finance Update

on:
  schedule:
    - cron: '39 * * * *'       # 每小時新聞
    - cron: '9 21 * * 0-4'    # 台北 05:09 晨報
    - cron: '09 7 * * 1-5'     # 台北 15:09 盤後
    - cron: '09 21 * * 5,6'    # 週末特刊
  workflow_dispatch:
    inputs:
      task_type:
        description: '任務類型'
        default: 'full_report'
        type: choice
        options: [full_report, news_only]

permissions:
  contents: write

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install dependencies
        run: |
          pip install pandas requests lxml yfinance curl-cffi feedparser google-generativeai

      - name: Run agent
        env:
          TASK_TYPE: ${{ github.event.inputs.task_type || (github.event.schedule == '50 * * * *' && 'news_only' || 'full_report') }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python finance_news_agent.py

      - name: Commit & push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto update"
