name: Hourly & Daily Finance Update (Smart Schedule)

# 1️⃣ 經理的鬧鐘設定
on:
  schedule:
    # ⏱️ 任務A：每小時滾動新聞 (只更新新聞，不叫AI)
    - cron: "0 * * * *"
    # ☀️ 任務B：盤前快報 (AI深度報告 + 推播)
    - cron: "05 21 * * 0-4"
    # 🌙 任務C：盤後快報 (AI深度報告 + 推播)
    - cron: "35 6 * * 1-5"
    # 🥂 任務D：週末特刊 (AI深度報告 + 推播)
    - cron: "30 22 * * 5,6"
    
  # 🌟 神級功能：手動點擊時，讓您自己選要執行什麼任務！
  workflow_dispatch: 
    inputs:
      task_type:
        description: '手動測試：請選擇要執行的任務'
        required: true
        default: 'full_report'
        type: choice
        options:
          - full_report
          - news_only

permissions:
  contents: write
concurrency:
  group: daily-finance-update
  cancel-in-progress: true

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 2️⃣ 經理開始發號施令：判斷是哪個鬧鐘響了，決定任務類型！
      - name: Set Task Type
        id: set-task
        run: |
          # 預設為全套報告
          echo "TASK_TYPE=full_report" >> $GITHUB_ENV
          
          # 如果是「每小時0分」那個鬧鐘叫醒的，就改成只抓新聞
          if [[ "${{ github.event.schedule }}" == "0 * * * *" ]]; then
            echo "TASK_TYPE=news_only" >> $GITHUB_ENV
          fi
          
          # 如果是您在網頁上手動觸發的，就看您選了什麼
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "TASK_TYPE=${{ github.event.inputs.task_type }}" >> $GITHUB_ENV
          fi

      # 3️⃣ 把經理的指令 (TASK_TYPE) 交給 Python 去執行
      - name: Run agent (Execute Task)
        env:
          TASK_TYPE: ${{ env.TASK_TYPE }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python finance_news_agent.py

      - name: Commit & push updated data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto update: ${{ env.TASK_TYPE }}"

      - name: Ping Streamlit to keep awake
        run: |
          curl -s https://financedailynews-mobile.streamlit.app/ > /dev/null
          curl -s https://financedailynews-web.streamlit.app/ > /dev/null
