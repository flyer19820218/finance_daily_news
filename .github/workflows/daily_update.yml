name: Hourly Finance Update (Smart Schedule)

on:
  schedule:
    # 這是「每小時的第 0 分鐘」自動執行的密碼 (例如 1:00, 2:00, 3:00...)
    - cron: "0 * * * *"
    
  workflow_dispatch: 

permissions:
  contents: write

concurrency:
  group: daily-finance-update
  cancel-in-progress: true

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run agent (generate report)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
        run: python finance_news_agent.py

      - name: Commit & push updated data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto update hourly data (Smart Schedule)"

      - name: Ping Streamlit to keep awake
        run: |
          curl -s https://financedailynews-mobile.streamlit.app/ > /dev/null
          curl -s https://financedailynews-web.streamlit.app/ > /dev/null
