name: market-bot

on:
  schedule:
    - cron: "0 22 * * *"  # 台灣06:00
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:

    - uses: actions/checkout@v4

    - name: install
      run: pip install pandas requests lxml

    - name: run bot
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python bot.py
