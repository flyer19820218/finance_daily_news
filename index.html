<!DOCTYPE html>
<html lang="zh-TW" style="color-scheme: light;">
<head>
  <meta charset="UTF-8">
  <title>財經AI快報</title>
  
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  
  <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/flyer19820218/finance_daily_news/refs/heads/main/icon.png?v=2">
  
  <style>
    body { 
      margin: 0; 
      padding: 0; 
      height: 100vh; 
      overflow: hidden; 
      background-color: #FFFFFF; 
      font-family: "HanziPen SC", sans-serif; 
      position: relative; 
    }
    
    /* 鑲嵌快報的視窗：底部留 25px 的空間給遮蔽條 */
    iframe { 
      width: 100%; 
      height: 100%; 
      border: none; 
      padding-bottom: 25px; 
      box-sizing: border-box; 
    }
    
    /* 戰術遮蔽條：用來蓋住 Streamlit 氣球浮水印 */
    .dummy-footer {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 25px; 
      background-color: #FFFFFF; 
      z-index: 9999; 
      border-top: 1px solid #e7ebf3; 
    }
  </style>
</head>
<body>
  <iframe src="https://financedailynews-mobile.streamlit.app/?embed=true"></iframe>
  <div class="dummy-footer"></div>
</body>
</html>
